<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Picture Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #4CAF50;
        }
        
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        
        button:hover {
            background: #45a049;
        }
        
        #status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .info {
            background: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>

<body>
    <h1>Profile Picture Upload Test</h1>

    <div class="test-section">
        <h2>1. Login</h2>
        <input type="email" id="email" value="admin@cineforge.ai" placeholder="Email">
        <input type="password" id="password" value="Admin@123" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>

    <div class="test-section">
        <h2>2. Upload Profile Picture</h2>
        <input type="file" id="fileInput" accept="image/*">
        <button onclick="uploadImage()">Upload</button>
    </div>

    <div class="test-section">
        <h2>3. Current Profile Picture</h2>
        <button onclick="getProfile()">Refresh</button>
        <div id="avatarContainer" style="margin-top: 10px;">
            <p>No image loaded yet</p>
        </div>
    </div>

    <div id="status"></div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        let token = null;

        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = type;
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    token = data.access_token;
                    showStatus('✓ Login successful!', 'success');
                    getProfile();
                } else {
                    showStatus('✗ Login failed: ' + data.error, 'error');
                }
            } catch (error) {
                showStatus('✗ Error: ' + error.message, 'error');
            }
        }

        async function uploadImage() {
            if (!token) {
                showStatus('Please login first', 'error');
                return;
            }

            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!file) {
                showStatus('Please select a file', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                showStatus('Uploading...', 'info');

                const response = await fetch(`${API_BASE}/users/upload-avatar`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus('✓ Image uploaded successfully!', 'success');
                    console.log('Upload response:', data);
                    console.log('Profile pic URL length:', data.profile_pic_url ? .length);
                    getProfile();
                } else {
                    showStatus('✗ Upload failed: ' + data.error, 'error');
                }
            } catch (error) {
                showStatus('✗ Error: ' + error.message, 'error');
            }
        }

        async function getProfile() {
            if (!token) {
                showStatus('Please login first', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/users/profile`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    const user = data.user;
                    const container = document.getElementById('avatarContainer');

                    if (user.profile_pic_url) {
                        container.innerHTML = `
                            <img src="${user.profile_pic_url}" class="avatar" alt="Profile">
                            <p><strong>Name:</strong> ${user.first_name} ${user.last_name}</p>
                            <p><strong>Email:</strong> ${user.email}</p>
                            <p><strong>Image URL Length:</strong> ${user.profile_pic_url.length} characters</p>
                            <details>
                                <summary>View Image URL (click to expand)</summary>
                                <textarea readonly style="width: 100%; height: 100px;">${user.profile_pic_url}</textarea>
                            </details>
                        `;
                        showStatus('✓ Profile loaded', 'success');
                    } else {
                        container.innerHTML = '<p>No profile picture set</p>';
                        showStatus('No profile picture found', 'info');
                    }
                } else {
                    showStatus('✗ Failed to get profile: ' + data.error, 'error');
                }
            } catch (error) {
                showStatus('✗ Error: ' + error.message, 'error');
            }
        }
    </script>
</body>

</html>
